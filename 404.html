<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <!-- absolute paths: this page is served at whatever address was missing -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "night"
            : "day");
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <button class="theme-toggle" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
        />
      </svg>
    </button>

    <header>
      <h1>Page not found</h1>
      <p class="description">
        There's nothing at this address. The page may have moved, or it never
        existed.
      </p>
    </header>

    <main>
      <h2>404</h2>
      <p><a href="/">Back to the home page</a></p>
    </main>

    <script>
      const root = document.documentElement;

      document.querySelector(".theme-toggle").onclick = () => {
        root.dataset.theme = root.dataset.theme === "night" ? "day" : "night";
        try {
          localStorage.setItem("theme", root.dataset.theme);
        } catch {}
      };
    </script>
    <footer class="credits">
      Made with <a href="https://github.com/Bubu-Droid/bloops">bloops</a>
      and the
      <a href="https://github.com/Bubu-Droid/nekopurrin">nekopurrin</a>
      template.
    </footer>
  </body>
</html>
