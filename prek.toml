# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [{ id = "conventional-pre-commit", stages = ["commit-msg"] }]

# the whitespace fixers skip what bloops generates (each post's index.html and
# its compiled diagrams), since every build writes those files again
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  {
    id = "trailing-whitespace",
    exclude = "^[^/]+/(index\\.html|static/[^/]+\\.svg)$"
  },
  {
    id = "end-of-file-fixer",
    exclude = "^[^/]+/(index\\.html|static/[^/]+\\.svg)$"
  },
  { id = "check-toml" },
  { id = "check-yaml" },
  {
    id = "mixed-line-ending",
    exclude = "^[^/]+/(index\\.html|static/[^/]+\\.svg)$"
  },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-executables-have-shebangs" },
]

[[repos]]
repo = "meta"
hooks = [{ id = "check-useless-excludes" }]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.9.7"
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"
hooks = [{ id = "codespell" }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.3"
hooks = [{ id = "ruff-format" }, { id = "ruff-check" }]

[[repos]]
repo = "https://github.com/DetachHead/basedpyright-prek-mirror"
rev = "1.40.2"
hooks = [{ id = "basedpyright" }]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.2"
hooks = [{ id = "rumdl-fmt" }, { id = "rumdl" }]

# post pages (<slug>/index.html) are left alone: bloops rewrites them on
# every build, and build.py writes their titles
[[repos]]
repo = "https://github.com/JoC0de/pre-commit-prettier"
rev = "v3.9.10"
hooks = [
  {
    id = "prettier",
    types_or = ["html", "css", "javascript"],
    exclude = "^[^/]+/index\\.html$"
  },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "build",
    name = "build.py (post list and page titles are up to date)",
    entry = "python build.py --check",
    language = "python",
    language_version = ">=3.12",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"]
  },
]
